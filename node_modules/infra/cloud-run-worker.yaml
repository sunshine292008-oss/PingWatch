apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: autotrace-worker
spec:
  template:
    spec:
      template:
        spec:
          containers:
            - image: gcr.io/PROJECT_ID/autotrace:latest
              command: ["python"]
              args: ["-m", "autotrace.worker"]
              env:
                - name: SUPABASE_URL
                  valueFrom: { secretKeyRef: { name: supabase-url, key: latest } }
                - name: SUPABASE_SERVICE_KEY
                  valueFrom: { secretKeyRef: { name: supabase-service-key, key: latest } }
                - name: RESEND_API_KEY
                  valueFrom: { secretKeyRef: { name: resend-api-key, key: latest } }
                - name: GEMINI_API_KEY
                  valueFrom: { secretKeyRef: { name: gemini-api-key, key: latest } }
          restartPolicy: Never
